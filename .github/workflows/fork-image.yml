# Fork: baut das Yuvomi-Image fuer nebulus auf GitHub statt lokal.
#
# Warum: Vite 8 (Rolldown) stuerzt auf der CPU von nebulus mit
# "Illegal instruction" ab - der Build braucht einen neueren Prozessor, der
# Betrieb nicht. Das Original baut aus demselben Grund in GitHub Actions.
#
# Laeuft bei jedem Push auf den Branch `nebulus` und per Hand (Actions-Tab ->
# "Fork image" -> "Run workflow"). Baut nur linux/amd64, prueft vorher die
# Fork-Tests und legt das Image in GHCR ab:
#   ghcr.io/<owner>/yuvomi-fork:nebulus        (immer der neueste Stand)
#   ghcr.io/<owner>/yuvomi-fork:<version>-ext  (z. B. 2.95.0-ext)
#   ghcr.io/<owner>/yuvomi-fork:sha-<commit>
# Eigene Datei, kein Upstream-Workflow wird veraendert: bei Yuvomi-Updates
# kann sie nicht in Konflikt geraten.
name: Fork image

on:
  push:
    branches: [nebulus]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fork-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/fork/display-extension-modules.test.js

  image:
    name: Build & Push (amd64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version aus package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/yuvomi-fork
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.value }}-ext
            type=sha
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
